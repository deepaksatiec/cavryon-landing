<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cavryon Deferred Revenue</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: "Segoe UI", -apple-system, sans-serif;
      background: #0B1020;
      color: #FFFFFF;
      margin: 0;
      padding: 16px;
      font-size: 13px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px 0;
    }
    p.sub {
      color: #9CA3AF;
      font-size: 11px;
      margin: 0 0 16px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #111827;
      color: #FFFFFF;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.primary {
      background: #2563EB;
      border: none;
      font-weight: 600;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    #status.ok {
      background: rgba(34,197,94,0.15);
      color: #4ADE80;
      display: block;
    }
    #status.err {
      background: rgba(239,68,68,0.15);
      color: #F87171;
      display: block;
    }
    .tagline {
      color: #60A5FA;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h1>Cavryon</h1>
  <p class="tagline">Mapped once. Trusted every close.</p>
  <p class="sub">Generates a subscription revenue recognition schedule directly into this workbook. Mid-month convention and mid-term tier upgrades handled automatically.</p>

  <button id="loadSampleBtn">Load Sample Data</button>
  <button id="generateBtn" class="primary">Generate Schedule in Sheet</button>

  <div id="status"></div>

  <script type="text/javascript" src="taskpane.js"></script>
</body>
</html>
